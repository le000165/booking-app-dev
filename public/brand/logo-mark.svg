<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FrontBeach logo mark">
  <!-- Container: Deep Navy rounded square -->
  <rect width="40" height="40" rx="8" fill="#0F172A"/>
  <!-- F letterform — white vertical stroke -->
  <rect x="10" y="10" width="5" height="20" rx="1.5" fill="#FFFFFF"/>
  <!-- F letterform — white mid horizontal stroke -->
  <rect x="10" y="18" width="14" height="4" rx="1" fill="#FFFFFF"/>
  <!-- Horizon accent — Cyan top bar (the brand signature line) -->
  <rect x="10" y="10" width="20" height="5" rx="1.5" fill="#06B6D4"/>
</svg>
